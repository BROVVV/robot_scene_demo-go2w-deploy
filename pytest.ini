[pytest]
# The repository contains vendored projects and a read-only robot snapshot.
# They are evidence/deployment artifacts, not this project's test suite; do
# not let duplicate module names or optional third-party dependencies make a
# root-level `pytest` run collect them accidentally.
testpaths = tests
norecursedirs =
    .git
    .venv
    build
    install
    external
    github_artifacts
    outputs
    runtime
