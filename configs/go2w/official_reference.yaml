    applicability: Manufacturer standing envelope; posture and tire compression can change the physical envelope.
  tire_nominal_diameter_m:
    value: 0.1778
    source: product_page_7_inch
  base_collision_box_m:
    length: 0.3762
    width: 0.0935
    height: 0.114
    source: go2w_urdf_base_collision
  navigation_footprint_xy_m:
    points:
      - [0.35, 0.215]
      - [0.35, -0.215]
      - [-0.35, -0.215]
      - [-0.35, 0.215]
    source: product_page_standing_length_width
    derivation: Centered rectangular projection of the manufacturer standing envelope about the official URDF base origin.
    execution_validation_required: true
frames:
  base_frame_mapping:
    official_urdf_frame: base
    ros_frame: base_link
    accepted: true
    basis: Project REP-105 name for the official Go2-W base frame.
  base_to_lidar:
    official_urdf_child: radar
    ros_child: utlidar_lidar
    translation_m: [0.28945, 0.0, -0.046825]
    # Published /utlidar/cloud and /utlidar/imu are already in the z-up SDK
    # frame (live IMU specific force ~ (3.0, 0.0, 9.8) m/s^2 and cloud
    # elevation -1.1..+89.6 deg). The official URDF pitch 2.8782 rad
    # (~165 deg) applies to the sensor's native z-down mounting frame; the
    # ROS frame therefore uses (2.8782 - pi) = -0.263393 rad, i.e. the
    # official rotation minus a 180 deg y-flip. Verified live 2026-08-06.
    rotation_rpy_rad: [0.0, -0.263392653559, 0.0]
    source: go2w_urdf_radar_joint
    accepted: true
    accepted_basis: >
      live IMU gravity direction, published z-up cloud elevation range, and
      the official URDF leg-chain geometry; replaces the previous
      manufacturer-flip interpretation that produced a world-down cloud.
    verification_evidence:
      - live_imu_specific_force_20260806: "(3.0, 0.0, 9.8) m/s^2 in utlidar_imu"
      - live_cloud_elevation_20260806: "-1.14..+89.60 deg in utlidar_lidar"
      - derived_pitch_deg: -15.09
      - derived_rpy_rad: [0.0, -0.263392653559, 0.0]
  lidar_to_lidar_imu:
    parent: utlidar_lidar
    child: utlidar_imu
    translation_m: [-0.007698, -0.014655, 0.00667]
    rotation_rpy_rad: [0.0, 0.0, 0.0]
    source: unilidar_sdk2_coordinate_system_definition
    accepted: true
safety:
  authorizes_motion: false
  camera_extrinsics_available: false
  base_ground_height_available: false
  require_live_tf_and_cloud_orientation_check: true
  require_footprint_clearance_validation_before_execution: true
