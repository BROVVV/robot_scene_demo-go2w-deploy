# Diagnostic preprocessor configuration for the PandarXT-16 stream.
#
# The Pandar stream (/hesai/pandarxt16/points_raw) is NOT part of the motion
# safety chain. This preprocessor only republishes a zero-return-filtered
# diagnostic cloud plus per-frame status, self-occlusion and observability
# debug topics. It never replaces /utlidar/cloud or /go2w/lidar/scan and it
# never publishes rotation_clearance_valid.
schema_version: 1

input_topic: /hesai/pandarxt16/points_raw
input_frame: pandarxt16_link_unvalidated
output_frame: pandarxt16_link_unvalidated

zero_return:
  enabled: true
  maximum_range_m: 0.05

range_m:
  minimum: 0.30
  maximum: 60.0

ring:
  expected_rings: 16

freshness:
  timeout_seconds: 1.0
  status_publish_period_seconds: 1.0

self_occlusion:
  # AABB in the Pandar sensor frame around the robot body/mount seen by the
  # sensor. Points inside are reported as self-occlusion, not as obstacles.
  # Values are conservative placeholders; formal self-occlusion validation
  # must overwrite them before any safety use.
  body_region:
    x_min: -0.70
    x_max: 0.70
    y_min: -0.30
    y_max: 0.30
    z_min: -0.60
    z_max: 0.20

observability:
  azimuth_bin_count: 360
  min_range_m: 0.30
  max_range_m: 6.0

outputs:
  points_filtered: /go2w/hesai/points_filtered_diagnostic
  status: /go2w/hesai/status
  self_occlusion_debug: /go2w/hesai/self_occlusion_debug
  observability_debug: /go2w/hesai/observability_debug

diagnostic_only: true
authorizes_motion: false
authorizes_safety_integration: false
