# QoS overrides for raw GO2-W sensor streams.
#
# A best-effort subscription is compatible with both best-effort and reliable
# publishers.  This is important for Unitree's DDS sensor topics: forcing the
# rosbag default reliable subscription can silently record zero messages from
# a best-effort publisher.
/lf/sportmodestate:
  history: keep_last
  depth: 100
  reliability: best_effort
  durability: volatile
/lf/lowstate:
  history: keep_last
  depth: 200
  reliability: best_effort
  durability: volatile
/sportmodestate:
  history: keep_last
  depth: 100
  reliability: best_effort
  durability: volatile
/lowstate:
  history: keep_last
  depth: 200
  reliability: best_effort
  durability: volatile
/wirelesscontroller:
  history: keep_last
  depth: 100
  reliability: best_effort
  durability: volatile
/wirelesscontroller_unprocessed:
  history: keep_last
  depth: 100
  reliability: best_effort
  durability: volatile
/utlidar/imu:
  history: keep_last
  depth: 1000
  reliability: best_effort
  durability: volatile
/utlidar/cloud:
  history: keep_last
  depth: 100
  reliability: best_effort
  durability: volatile
/utlidar/cloud_base:
  history: keep_last
  depth: 100
  reliability: best_effort
  durability: volatile
/utlidar/cloud_deskewed:
  history: keep_last
