# plain_slam_ros2 SLAM (pose-graph backend) parameter template for Go2-W.
#
# Same contract as plain_slam_lio_params.yaml: the generator derives the
# runtime file; this is the human-maintained source of truth for thresholds.
#
# Upstream defaults are tuned for outdoor cars (keyframe distance 10 m);
# for an indoor wheeled quadruped we keep keyframes dense (1.5 m / 25 deg).
schema_version: 1

slam_3d_node:
  ros__parameters:
    preprocess:
      accumulation_cycle: 2
      scan_cloud_filter_size: 0.15

    keyframe:
      distance_th: 1.5
      angle_th: 25.0
      min_local_map_matching_rate: 0.70

    loop_closure:
      num_loop_candidates: 10
      loop_detection_distance_thresh: 12.0
      loop_detection_height_thresh: 3.0
      error_average_th: 0.8
      active_points_rate_th: 0.45
      gicp_max_iteration: 8
      gicp_epsilon: 0.3
      gicp_max_correspondence_dist: 3.0
      gicp_huber_delta: 0.5

    pose_graph:
      huber_delta: 0.1