    - outputs/go2w_acceptance/point_lio_stationary_corrected_tf/stale_timeout.json
  evidence_note: >
    The corrected base_to_lidar rotation (2.8782 - pi) rad was introduced on
    2026-08-06; the corrected-TF 60 s stationary rerun passed all gates.
  duration_seconds: 299.93334555625916
  odometry_samples: 4615
  median_rate_hz: 15.385109731091882
  maximum_stamp_gap_seconds: 0.06864666938781738
  final_displacement_m: 0.07851094077184916
  maximum_displacement_m: 0.0933579057724731
  yaw_span_deg: 1.6242589252913882
  sustained_linear_speed_p95_mps: 0.04105992353273908
  sustained_angular_speed_p95_radps: 0.010661616633468795
  bridge_dropped_messages: 0
