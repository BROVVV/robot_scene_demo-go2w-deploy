amcl:
  ros__parameters: {use_sim_time: false, base_frame_id: base_link, global_frame_id: map, odom_frame_id: odom}
planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased: {plugin: "nav2_navfn_planner/NavfnPlanner", tolerance: 0.25, use_astar: true, allow_unknown: false}
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    controller_plugins: [FollowPath]
    goal_checker_plugins: [general_goal_checker]
    general_goal_checker: {plugin: "nav2_controller::SimpleGoalChecker", xy_goal_tolerance: 0.25, yaw_goal_tolerance: 0.25, stateful: true}
    FollowPath: {plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController", desired_linear_vel: 0.15, lookahead_dist: 0.35, use_velocity_scaled_lookahead_dist: true, max_angular_accel: 0.40}
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      # Unitree Go2-W official 0.70 x 0.43 m standing envelope, centered on base_link.
      # Execution still requires live clearance validation and the separate hard gate.
      footprint: "[[0.35,0.215],[0.35,-0.215],[-0.35,-0.215],[-0.35,0.215]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer: {plugin: "nav2_costmap_2d::StaticLayer"}
      obstacle_layer: {plugin: "nav2_costmap_2d::ObstacleLayer", observation_sources: scan, scan: {topic: /go2w/lidar/scan, data_type: LaserScan, clearing: true, marking: true}}
      inflation_layer: {plugin: "nav2_costmap_2d::InflationLayer", inflation_radius: 0.55}
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Same manufacturer standing envelope as the global costmap.
      footprint: "[[0.35,0.215],[0.35,-0.215],[-0.35,-0.215],[-0.35,0.215]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer: {plugin: "nav2_costmap_2d::ObstacleLayer", observation_sources: scan, scan: {topic: /go2w/lidar/scan, data_type: LaserScan, clearing: true, marking: true}}
      inflation_layer: {plugin: "nav2_costmap_2d::InflationLayer", inflation_radius: 0.55}
bt_navigator:
  ros__parameters: {global_frame: map, robot_base_frame: base_link, odom_topic: /lio/odom}
behavior_server:
  ros__parameters: {global_frame: map, robot_base_frame: base_link}
map_server:
  ros__parameters: {yaml_filename: ""}
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.15, 0.0, 0.20]
    min_velocity: [-0.15, 0.0, -0.20]
    max_accel: [0.20, 0.0, 0.40]
    max_decel: [-0.20, 0.0, -0.40]
    odom_topic: /lio/odom
    velocity_timeout: 0.30
