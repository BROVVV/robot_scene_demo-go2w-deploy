# Pinned Foxy compatibility plugins. Production execution remains gated.
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /go2w/odom/fused
    # Foxy hardcodes its BT blackboard timeout; XML ports explicitly select
    # the project's intended 20ms ACK timeout. Humble parameter names are ignored.
    enable_groot_monitoring: false
    plugin_lib_names:
    - nav2_clear_costmap_service_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_rate_controller_bt_node
    - nav2_recovery_node_bt_node
    - nav2_round_robin_node_bt_node
    - go2w_foxy_bt_actions
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: false
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /go2w/odom/fused
    progress_checker_plugin: progress_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 8.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.2
      stateful: false
    FollowPath:
      plugin: go2w_foxy_rpp::RegulatedPurePursuitController
      desired_linear_vel: 0.3
      min_approach_linear_velocity: 0.3
      lookahead_dist: 0.3
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.45
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.8
      cost_scaling_gain: 0.5
      inflation_cost_scaling_factor: 2.0
      regulated_linear_scaling_min_speed: 0.3
      max_angular_accel: 0.8
      transform_tolerance: 0.3
    goal_checker_plugin: general_goal_checker
behavior_server:
  ros__parameters:
    global_frame: odom_fused
    robot_base_frame: base_link
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    spin:
      plugin: go2w_foxy_spin::Spin
    wait:
      plugin: nav2_recoveries/Wait
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.8
    recovery_plugins:
    - spin
    - wait
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      footprint: '[[0.35, 0.215], [0.35, -0.215], [-0.35, -0.215], [-0.35, 0.215]]'
      footprint_padding: 0.04
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /go2w/lidar/navigation_scan
          data_type: LaserScan
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.0
        cost_scaling_factor: 2.0
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom_fused
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      footprint: '[[0.35, 0.215], [0.35, -0.215], [-0.35, -0.215], [-0.35, 0.215]]'
      footprint_padding: 0.04
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /go2w/lidar/navigation_scan
          data_type: LaserScan
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.0
        cost_scaling_factor: 2.0
